
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
      <img
        src="images/day10.png"
        alt="When2Meet Logo"
        class="logo-image"
      />
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

     

      <!-- Calendar -->
      <a
        routerLink="/calendar"
        routerLinkActive="active"
        class="nav-item"
        aria-label="My Calendar">

        <svg viewBox="0 0 24 24" class="nav-icon">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M16 3v4M8 3v4M3 10h18"/>
          <path d="M8 14h2M14 14h2M8 17h2"/>
        </svg>

        <span class="nav-text">My Calendar</span>
      </a>

      <!-- Tasks -->
      <a
        routerLink="/tasks"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Tasks">

        <svg viewBox="0 0 24 24" class="nav-icon">
          <path d="M9 6h11M9 12h11M9 18h11"/>
          <path d="m3 6 1.5 1.5L7 5"/>
          <path d="m3 12 1.5 1.5L7 11"/>
          <path d="m3 18 1.5 1.5L7 17"/>
        </svg>

        <span class="nav-text">Tasks</span>
      </a>

      <!-- AI Studio -->
      <a
        routerLink="/ai-studio"
        routerLinkActive="active"
        class="nav-item"
        aria-label="AI Studio">

        <svg viewBox="0 0 24 24" class="nav-icon">
          <path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-2-5.8L4 11l6-2.2L12 3Z"/>
          <path d="m19 14 1.2 2.8L23 18l-2.8 1.2L19 22l-1.2-2.8L15 18l2.8-1.2L19 14Z"/>
        </svg>

        <span class="nav-text">AI Studio</span>
      </a>

      <!-- Friends -->
      <a
        routerLink="/friends"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Friends">

        <svg viewBox="0 0 24 24" class="nav-icon">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20v-1.5a6.5 6.5 0 0 1 13 0V20Z"/>
          <path d="M16 5a3.5 3.5 0 0 1 0 6.8"/>
          <path d="M18 14a5 5 0 0 1 3.5 4.5V20h-3"/>
        </svg>

        <span class="nav-text">Friend</span>
      </a>
 <!-- Overview -->
      <a
        routerLink="/calendarDetails"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        aria-label="Overview">

      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M20 12h-9.5m7.5 3 3-3-3-3m-5-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-1" />
</svg>

        <span class="nav-text">Logout</span>
      </a>
    </nav>

    <!-- Bottom navigation -->
    <div class="sidebar-bottom">

      <a
        routerLink="/settings"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Settings">

        <svg viewBox="0 0 24 24" class="nav-icon">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 3.1-.2-.1a1.7 1.7 0 0 0-1.8.2l-.2.1h-3.6l-.1-.2a1.7 1.7 0 0 0-1.5-1.1 1.7 1.7 0 0 0-1.1.3l-.2.1-3.1-1.8.1-.2a1.7 1.7 0 0 0-.2-1.8l-.1-.2v-3.6l.2-.1a1.7 1.7 0 0 0 1.1-1.5 1.7 1.7 0 0 0-.3-1.1l-.1-.2 1.8-3.1.2.1a1.7 1.7 0 0 0 1.8-.2l.2-.1h3.6l.1.2a1.7 1.7 0 0 0 1.5 1.1 1.7 1.7 0 0 0 1.1-.3l.2-.1 3.1 1.8-.1.2a1.7 1.7 0 0 0 .2 1.8l.1.2v3.6Z"/>
        </svg>

        <span class="nav-text">Settings</span>
      </a>

    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
