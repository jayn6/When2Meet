<div class="ai-page">

  <!-- HEADER -->
  <header class="page-header">
    <div>
      <h1>AI Studio</h1>
      <p>Bring timetables and exams into one calendar.</p>
    </div>
    <span class="pill">✧ AI powered</span>
  </header>

  <div class="columns">

    <!-- ============ LEFT : AI TIMETABLE IMPORT ============ -->
    <section class="col">

      <h2>Turn any timetable into your calendar</h2>

      <ol class="steps">
        <li *ngFor="let s of steps; let i = index"
            [class.on]="i <= currentStep"
            [class.current]="i === currentStep">
          <span class="bar"></span>
          <span class="label">{{ s }}</span>
        </li>
      </ol>

      <div class="message error" *ngIf="errorMessage">⚠ {{ errorMessage }}</div>
      <div class="message success" *ngIf="successMessage">✓ {{ successMessage }}</div>

      <!-- UPLOAD -->
      <ng-container *ngIf="rows.length === 0">

        <label class="dropzone"
               [class.drag]="dragging"
               [class.has-file]="previewUrl"
               (dragover)="onDragOver($event)"
               (dragleave)="onDragLeave()"
               (drop)="onDrop($event)">

          <input type="file"
                 accept="image/png,image/jpeg,image/webp"
                 (change)="onFileSelected($event)"
                 hidden>

          <ng-container *ngIf="!previewUrl">
            <!-- little paper with coloured lines, like the mock-up -->
            <svg class="doc-icon" viewBox="0 0 80 100" aria-hidden="true">
              <g transform="rotate(-4 40 50)">
                <rect x="6" y="6" width="68" height="88" fill="#fffdf5" stroke="#3a2c0f" stroke-width="3"/>
                <rect x="18" y="24" width="44" height="7" fill="#FFD84D"/>
                <rect x="18" y="38" width="44" height="7" fill="#cdbdf5"/>
                <rect x="18" y="52" width="44" height="7" fill="#d9f26b"/>
                <rect x="18" y="66" width="44" height="7" fill="#ff8a78"/>
              </g>
            </svg>
            <strong>Drop a timetable image</strong>
            <span class="formats">PNG · JPG · WEBP · max 10 MB</span>
          </ng-container>

          <ng-container *ngIf="previewUrl">
            <img [src]="previewUrl" alt="Timetable preview">
            <strong>{{ selectedFile?.name }}</strong>
            <button type="button" class="link-btn" (click)="clearFile($event)">Remove</button>
          </ng-container>

        </label>

        <button type="button"
                class="btn blue"
                [disabled]="!selectedFile || isLoading"
                (click)="extract()">
          {{ isLoading ? 'Reading your timetable…' : 'Extract with AI' }}
        </button>

      </ng-container>

      <!-- REVIEW -->
      <div class="card review" *ngIf="rows.length > 0">

        <div class="period">
          <label>
            <span>From</span>
            <input type="date" [(ngModel)]="startDate" name="startDate">
          </label>
          <label>
            <span>To</span>
            <input type="date" [(ngModel)]="endDate" name="endDate">
          </label>
          <small>The weekly timetable repeats between these dates.</small>
        </div>

        <div class="table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th></th>
                <th>Title</th>
                <th>Day</th>
                <th>Time</th>
                <th>Room</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let r of rows; let i = index" [class.off]="!r.include">
                <td>
                  <input type="checkbox" class="check" [(ngModel)]="r.include" [name]="'inc-' + i">
                </td>
                <td>
                  <input class="cell" [(ngModel)]="r.subject" [name]="'subject-' + i" placeholder="Subject">
                  <div class="tags" *ngIf="needsCheck(i) || isDuplicate(i)">
                    <span class="tag lime" *ngIf="needsCheck(i)">Check time</span>
                    <span class="tag lilac" *ngIf="isDuplicate(i)">Possible duplicate</span>
                  </div>
                </td>
                <td>
                  <select class="cell" [(ngModel)]="r.dayOfWeek" [name]="'day-' + i">
                    <option *ngFor="let d of weekdays" [value]="d">{{ shortDay(d) }}</option>
                  </select>
                </td>
                <td class="time-cell">
                  <input class="cell" type="time" [(ngModel)]="r.startTime" [name]="'start-' + i">
                  <span>–</span>
                  <input class="cell" type="time" [(ngModel)]="r.endTime" [name]="'end-' + i">
                </td>
                <td>
                  <input class="cell room" [(ngModel)]="r.room" [name]="'room-' + i" placeholder="—">
                </td>
                <td>
                  <button type="button" class="x-btn" (click)="removeRow(i)" aria-label="Remove row">×</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <button type="button" class="link-btn add-row" (click)="addRow()">+ Add a class</button>

        <div class="review-actions">
          <button type="button" class="btn ghost" (click)="cancelReview()">Cancel</button>
          <button type="button"
                  class="btn blue"
                  [disabled]="isSaving || includedCount === 0"
                  (click)="confirm()">
            {{ isSaving ? 'Importing…' : 'Import (' + includedCount + ')' }}
          </button>
        </div>

      </div>

    </section>
  
</div>
